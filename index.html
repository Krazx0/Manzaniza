```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manzaniza 🍎</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ff4b4b, #ff7676, #ffb347);
        position: relative;
    }

    /* Fondo con brillo */
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
            radial-gradient(circle at 20% 20%, rgba(255,255,255,.25), transparent 25%),
            radial-gradient(circle at 80% 70%, rgba(255,255,255,.18), transparent 30%);
        pointer-events: none;
    }

    /* Contenedor de manzanas */
    .apples {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
    }

    .apple {
        position: absolute;
        font-size: 22px;
        opacity: .75;
        animation: fly linear infinite;
        filter: drop-shadow(0 3px 5px rgba(0,0,0,.2));
    }

    @keyframes fly {
        0% {
            transform: translateY(110vh) translateX(0) rotate(0deg);
        }

        50% {
            transform: translateY(50vh) translateX(40px) rotate(180deg);
        }

        100% {
            transform: translateY(-15vh) translateX(-40px) rotate(360deg);
        }
    }

    /* Posiciones */
    .a1 { left: 5%; animation-duration: 12s; }
    .a2 { left: 13%; animation-duration: 17s; animation-delay: -4s; }
    .a3 { left: 22%; animation-duration: 14s; animation-delay: -8s; }
    .a4 { left: 31%; animation-duration: 19s; animation-delay: -2s; }
    .a5 { left: 40%; animation-duration: 13s; animation-delay: -6s; }
    .a6 { left: 50%; animation-duration: 18s; animation-delay: -10s; }
    .a7 { left: 59%; animation-duration: 15s; animation-delay: -3s; }
    .a8 { left: 68%; animation-duration: 20s; animation-delay: -7s; }
    .a9 { left: 77%; animation-duration: 14s; animation-delay: -5s; }
    .a10 { left: 87%; animation-duration: 17s; animation-delay: -9s; }
    .a11 { left: 94%; animation-duration: 12s; animation-delay: -1s; }

    /* Contenido */
    .content {
        position: relative;
        z-index: 2;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: white;
    }

    .box {
        padding: 45px 65px;
        border-radius: 30px;
        background: rgba(255,255,255,.15);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,.3);
        box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    h1 {
        font-size: 70px;
        letter-spacing: 3px;
        text-shadow: 0 5px 20px rgba(0,0,0,.25);
    }

    p {
        margin-top: 12px;
        font-size: 20px;
    }

    button {
        margin-top: 25px;
        padding: 13px 28px;
        border: none;
        border-radius: 999px;
        background: white;
        color: #e53935;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: .25s;
    }

    button:hover {
        transform: scale(1.08);
        box-shadow: 0 8px 25px rgba(0,0,0,.2);
    }

    @media (max-width: 600px) {
        h1 {
            font-size: 48px;
        }

        .box {
            padding: 35px 30px;
        }
    }
</style>
</head>

<body>

<div class="apples">
    <span class="apple a1">🍎</span>
    <span class="apple a2">🍏</span>
    <span class="apple a3">🍎</span>
    <span class="apple a4">🍏</span>
    <span class="apple a5">🍎</span>
    <span class="apple a6">🍏</span>
    <span class="apple a7">🍎</span>
    <span class="apple a8">🍏</span>
    <span class="apple a9">🍎</span>
    <span class="apple a10">🍏</span>
    <span class="apple a11">🍎</span>
</div>

<div class="content">
    <div class="box">
        <h1>🍎 Manzaniza</h1>
        <p>Bienvenido a Manzaniza</p>
        <button>Entrar</button>
    </div>
</div>

</body>
</html>
